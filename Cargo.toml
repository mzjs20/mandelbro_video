[package]
name = "mandelbrot-video"
version = "0.1.0"
edition = "2021"
description = "高性能Mandelbrot分形缩放视频生成器"
authors = ["unmei"]
license = "MIT"

[dependencies]
# GPU计算
wgpu = { version = "0.20", features = ["spirv"] }

# CPU并行
rayon = "1.10"

# 视频编码
rav1e = "0.7"

# 图像处理
image = "0.25"

# 配置文件
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# 进度显示
indicatif = { version = "0.17", features = ["rayon"] }

# 高精度算术（扰动理论参考轨道计算）
rug = "1.30"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 日志
log = "0.4"
env_logger = "0.11"

# 异步运行时（wgpu需要）
pollster = "0.3"
futures = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
