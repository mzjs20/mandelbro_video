# Mandelbrot分形视频生成器配置

[video]
width = 1920
height = 1080
fps = 30
duration_seconds = 30
output = "mandelbrot_zoom.mp4"

[zoom]
# 预设位置: "seahorse", "elephant", "triplespiral", "minimandelbrot", "custom"
preset = "triplespiral"
# 自定义位置时使用以下参数:
# center_re = -0.743643887037151
# center_im = 0.131825904205330
# initial_zoom = 1.0
# final_zoom = 1e14

[render]
max_iter_base = 256
color_scheme = "classic"
# 颜色方案: "classic", "fire", "ocean", "rainbow", "electric", "grayscale"
force_cpu = false  # 强制使用CPU（用于调试或无GPU环境）
use_perturbation = true  # 使用扰动理论加速（深度缩放时推荐）

[encoding]
quantizer = 18    # 质量参数，越低质量越高 (推荐: 18-23)